<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STOL AI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; background: #060712; color: #f6f7ff; }
      main { max-width: 520px; margin: 0 auto; padding: 28px 18px; }
      h1 { font-size: 34px; margin: 0 0 10px; letter-spacing: 0; }
      p { color: #b8bdd7; line-height: 1.5; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0; }
      button { border: 1px solid #2d3152; background: #11162a; color: #fff; padding: 14px; border-radius: 8px; font-size: 15px; }
      button.active { border-color: #55fff4; box-shadow: 0 0 22px rgba(85, 255, 244, .24); }
      .cta { width: 100%; background: #70ffe7; color: #061014; font-weight: 800; border: 0; }
      .price { margin-top: 26px; border-top: 1px solid #272b4a; padding-top: 18px; font-size: 15px; color: #d9ddff; }
    </style>
  </head>
  <body>
    <main>
      <h1>STOL AI</h1>
      <p>Выбери стиль, отправь фото в бот и получи реалистичное фото для сторис. Первая генерация бесплатная.</p>
      <div class="grid">
        <button class="active">Букет</button>
        <button>Пара</button>
        <button>Дубай</button>
        <button>Авто</button>
      </div>
      <button class="cta" onclick="Telegram.WebApp.close()">Перейти в бота</button>
      <div class="price">1 генерация - 99 рублей · 10 генераций - 499 рублей · безлимит - 1490 рублей/мес.</div>
    </main>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      document.querySelectorAll(".grid button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".grid button").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
        });
      });
      Telegram.WebApp.ready();
    </script>
  </body>
</html>
